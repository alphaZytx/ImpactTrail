services:
  api:
    build: .
    environment:
      RISKPULSE_DATABASE_URL: sqlite:////app/data/runtime/riskpulse.db
      RISKPULSE_MODEL_BACKEND: ${RISKPULSE_MODEL_BACKEND:-lexicon}
    ports:
      - "8000:8000"
    volumes:
      - riskpulse-data:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      RISKPULSE_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  riskpulse-data:

